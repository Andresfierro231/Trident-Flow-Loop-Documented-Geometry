# ACU STNCL — EPICS channel map for the acu-flowloop deposit.
#
# Generated 2026-09-04 by joining the site's authoritative sensor list
# (Design_Documentation/Instrumentation Documents/sensors.xlsx) to the
# channel table shipped with the archive deposit (Raw_Data/channels.csv).
# `description` is the site's own wording, copied verbatim.
#
# Units are declared only where the tag makes them unambiguous. A blank unit
# means unknown, which is the honest value until ACU exports the archiver's
# EGU field — a guessed unit is worse than an absent one.
#
#
# 2026-09-25, from the site (Dale Cox, ACU), three answers:
#
#  * `HE-*:Time` is the PWM PULSE WIDTH in MILLISECONDS — how long the channel
#    is left on — not an elapsed timer. This file said `unit = "s"` for all
#    thirteen, which is wrong by a factor of a thousand, and a wrong unit is
#    invisible downstream while an absent one is not.
#
#  * The `SetPoint` / `Setpoint` spelling difference is DELIBERATE, not a typo:
#    different drivers written by different people, and no naming convention
#    was enforced on the PVs. Do not "normalise" it. A map does not rename
#    channels, and here the two spellings are what the site actually publishes.
#
#  * EPICS PVs can carry `.DESC` and `.EGU`, and whether ACU's are populated is
#    UNDETERMINED — it needs a code sweep on their side. So the plan of "one
#    Channel Access sweep returns every unit" is not yet a plan; it may return
#    empty tags.
#
# This file is DATA, not code: a site supplies it, the platform reads it
# (ADR-023-A1 §A1.3). It does not rename channels — silver carries the source
# PV, and this adds the unit and the human description around it.

