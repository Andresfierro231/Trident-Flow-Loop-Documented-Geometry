# --------------------------------------------------------------------------
# Thermocouples.
#
# The PV spells the tag with an underscore (TC-CH1_1) and the sensor list
# spells it with a dot (TC-CH1.1). That is a transcription difference, not two
# instruments, and it is stated here rather than resolved by renaming anything:
# silver carries the PV exactly as acquired.
#
# Two PVs below have no row in the sensor list and are declared against a
# thermocouple class with no model, because "a thermocouple on the 16-bit
# module" is what the document supports and the model number is not.
# --------------------------------------------------------------------------

[instrument_class."thermocouple-unspecified"]
kind = "thermocouple"
measures = "temperature"
unit = "degC"
read_by = "ad-p1-04thm"
note = "Model not recorded in the source document."


