# manifold heater and one on the exp tank band heater appear in the sensor
# list with no PV anywhere in the data.
#
# TC-ETH1.1 and the PV NCDT1:HEAT:TC-ET1_1 may be the same instrument spelled
# two ways. That is a QUESTION for the site, not a merge: a name that looks
# like a typo is sometimes two real instruments, and joining them here would
# assert something nobody checked.

[[instrument]]
