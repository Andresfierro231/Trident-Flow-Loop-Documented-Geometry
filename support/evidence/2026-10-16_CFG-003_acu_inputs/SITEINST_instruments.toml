# ACU STNCL — what the instruments ARE (ADR-028).
#
# Transcribed 2026-09-25 from the site's own sensor list, kept beside this file
# at sources/ACU-STNCL-sensors.xlsx and extracted as sensors.csv. Every value
# here is written down in that document. Nothing is inferred.
#
# Two kinds of entry, following the DeepLynx metatype/node shape (ADR-028):
#
#   [instrument_class."<id>"]  one model of hardware, and everything true of
#                              every unit of it
#   [[instrument]]             one installed unit, where it sits, and the
#                              channels it feeds
#
# A property nobody wrote down is ABSENT, not zero and not guessed. Several
# units below are deliberately missing: the document does not state them, and
# they are what the open ask to the site is for.

schema_ref = "acu-flowloop/epics-v1"

# --------------------------------------------------------------------------
# Acquisition modules.
#
# A fault word belongs to the module that could not read, not to the sensor
# that was being read, which is why these are classes of their own and why
# the sensors name them with `read_by`. One line here reaches every channel
# that module serves.
# --------------------------------------------------------------------------

[instrument_class."ad-p1-04thm"]
maker = "AutomationDirect"
model = "P1-04THM"
kind = "acquisition_module"
bits = 16
sample_period_s = 0.2
note = "All thermocouple measurements go through this module."

[instrument_class."ad-p1-04rtd"]
maker = "AutomationDirect"
model = "P1-04RTD"
kind = "acquisition_module"

[instrument_class."ad-p1-04adl-1"]
maker = "AutomationDirect"
model = "P1-04ADL-1"
kind = "acquisition_module"
bits = 13
sample_period_s = 0.01

[instrument_class."ad-p1-04adl-2"]
maker = "AutomationDirect"
model = "P1-04ADL-2"
kind = "acquisition_module"
bits = 13

[instrument_class."ad-p1-04trs"]
maker = "AutomationDirect"
model = "P1-04TRS"
kind = "relay_module"

# --------------------------------------------------------------------------
# Sensors
# --------------------------------------------------------------------------

[instrument_class."omega-scain-062u-12"]
maker = "Dwyer Omega"
model = "SCAIN-062U-12"
kind = "thermocouple"
measures = "temperature"
unit = "degC"
read_by = "ad-p1-04thm"
url = "https://www.dwyeromega.com/en-us/thermocouple-probes-with-removable-miniature-connectors/QD-MINI-NOT-MOLDED/p/SCAIN-062U-12"

[instrument_class."omega-pr-31-3-100"]
maker = "Dwyer Omega"
model = "PR-31-3-100-A-1/8-1200-M12-1"
kind = "rtd"
measures = "temperature"
unit = "degC"
read_by = "ad-p1-04rtd"

[instrument_class."dwyer-626-02-gh-p1-e6-s1"]
maker = "Dwyer Omega"
model = "626-02-GH-P1-E6-S1"
kind = "pressure_transmitter"
measures = "pressure"
unit = "psia"
range_min = 0.0
range_max = 50.0
# 0.25 PERCENT OF SPAN, not 0.25 psia. Named as a percentage on purpose: an
# absolute and a relative accuracy are different quantities and a reader that
# cannot tell them apart will be wrong by a factor of the span.
uncertainty_pct_of_span = 0.25
read_by = "ad-p1-04adl-1"
note = "Document adds: 'Need to configure' the range and accuracy, so confirm before relying on them."

[instrument_class."omega-fma900a"]
maker = "Omega"
model = "FMA900A"
kind = "air_velocity_sensor"
measures = "velocity"
read_by = "ad-p1-04adl-2"
# No unit. The document does not state one, and a velocity sensor's unit is
# not readable off its model number.

[instrument_class."ad-fts200-1002"]
maker = "AutomationDirect"
model = "FTS200-1002"
kind = "thermal_flow_sensor"
measures = "velocity"
read_by = "ad-p1-04adl-1"

[instrument_class."banner-s24as-d-mqp"]
maker = "Banner Engineering"
model = "S24AS-D-MQP"
kind = "dewpoint_humidity_sensor"
protocol = "modbus-rtu-rs485"

[instrument_class."alicat-mc-1slpm"]
maker = "Alicat"
model = "MC-1SLPM-D-MODTCPIP-PCV10-.25COMP-IB"
kind = "mass_flow_controller"
protocol = "modbus-tcp"
# No unit, deliberately. "1SLPM" in the model number almost certainly means a
# one standard litre per minute full scale, and ADR-028 D6 says we do not read
# units out of model numbers. It is a question to the site, not a declaration.

[instrument_class."alicat-pcd-15psid"]
maker = "Alicat"
model = "PCD-15PSID-D-MODTCPIP-PCV65-.25COMP"
kind = "pressure_controller"
protocol = "modbus-tcp"

[instrument_class."asco-sc912yn16vfba4"]
maker = "ASCO"
model = "SC912YN16VFBA4"
kind = "solenoid_valve"
read_by = "ad-p1-04trs"

[instrument_class."tameson-solenoid"]
kind = "solenoid_valve"
read_by = "ad-p1-04trs"
note = "Model recorded only as '<tameson part>' in the source document."

[instrument_class."weg-cfw500"]
maker = "WEG"
model = "CFW500"
kind = "vfd"
protocol = "modbus-tcp"
note = "Drives the cooler fan."

[instrument_class."vega-puls-6s"]
maker = "Vega"
model = "VEGAPULS 6S"
kind = "level_radar"
measures = "level"
read_by = "ad-p1-04adl-1"
note = "Outputs a configurable analog signal."

[instrument_class."sporian-thermaflow-700"]
maker = "Sporian"
model = "940-000-0395-00"
kind = "flow_meter"
measures = "flow"
protocol = "ascii-serial-over-tcp"

[instrument_class."luna-odisi-7100"]
maker = "LUNA Innovations"
model = "ODiSi 7100"
kind = "fiber_optic_temperature"
measures = "temperature"
note = "Marked '<not yet implemented>' in the source document."

# --------------------------------------------------------------------------
# Installed units.
#
# Channel names are the PVs as acquired. An instrument with an empty
# `channels` list is installed and sends us nothing, which is a finding rather
# than an omission: see the README.
# --------------------------------------------------------------------------

